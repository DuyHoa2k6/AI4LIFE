name: Local Python analysis
on: [push, pull_request]
jobs:
  local-backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ScamShield_AI
    env:
      SCAMSHIELD_MODE: local_rules
      SCAMSHIELD_REASONER: legacy
      SCAMSHIELD_CONTEXT_ENABLED: '1'
      SCAMSHIELD_URL_NETWORK_ENABLED: '0'
      SCAMSHIELD_API_KEY: ''
      GEMINI_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/worker_security.mjs
      - run: node tests/popup_version.mjs
