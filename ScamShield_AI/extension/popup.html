<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>ScamShield AI</title><link rel="stylesheet" href="popup.css"><script src="shared.js" defer></script><script src="popup.js" defer></script></head>
<body>
  <div class="winbar">
    <button type="button" id="win-min" title="Thu nhỏ" aria-label="Thu nhỏ">–</button>
    <button type="button" id="win-max" title="Phóng to" aria-label="Phóng to">□</button>
  </div>
  <div class="brand"><span class="brand-icon" aria-hidden="true">◈</span><div><h1>ScamShield AI</h1><span class="subtitle">Kiểm tra trước khi tin</span></div></div>
  <p>Chọn vùng bạn muốn kiểm tra. Xem lại phạm vi và nơi xử lý trước khi bật quét.</p>
  <button id="choose" type="button">Chọn vùng quét</button>
  <button id="conversation" type="button">Thu thập hội thoại đang hiển thị · Thử nghiệm</button>

  <section class="section" aria-labelledby="df-heading">
    <h2 id="df-heading">Deepfake</h2>
    <p class="section-lead">Kiểm tra ảnh, video hoặc khuôn mặt trong cuộc gọi.</p>
    <label class="file-btn">Chọn ảnh hoặc video<input id="df-file" type="file" accept="image/*,video/*" hidden></label>
    <p id="df-fname" class="hint"></p>
    <button id="df-check" type="button" disabled>Kiểm tra ảnh / video</button>
    <div id="df-result" hidden></div>
    <button id="df-live" type="button">Quét deepfake cuộc gọi</button>
  </section>

  <p id="message" role="status" aria-live="polite"></p>
</body></html>
